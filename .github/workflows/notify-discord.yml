name: Notify Discord

on:
  push:
    branches:
      - feature/github-tech-digest
      - master
    paths:
      - 'digests/records/*.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find changed record file
        id: find
        run: |
          FILE=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'digests/records/*.json' 2>/dev/null | tail -1)
          if [ -z "$FILE" ]; then
            FILE=$(git show --name-only --pretty="" "${{ github.sha }}" -- 'digests/records/*.json' | tail -1)
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: steps.find.outputs.file != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, "scripts")
          from discord_notify import build_discord_payload, send_discord_notification

          record_path = "${{ steps.find.outputs.file }}"
          record = json.load(open(record_path, encoding="utf-8"))
          selected = [c for c in record["candidates"] if c["selected"]]

          artifact_url = ""
          if os.path.exists("digests/artifact_url.txt"):
              artifact_url = open("digests/artifact_url.txt", encoding="utf-8").read().strip()

          payload = build_discord_payload(selected, artifact_url)
          ok = send_discord_notification(os.environ["DISCORD_WEBHOOK_URL"], payload)
          print("sent" if ok else "failed")
          sys.exit(0 if ok else 1)
          PY
